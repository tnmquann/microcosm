name: kleborate_v3run
description: Run Kleborate v3 on one assembly with an optional preset and module list, as in playground/modular/3_kleb.sh.
keywords: [klebsiella, escherichia, typing, kleborate]
tools:
  - kleborate:
      description: Genomic surveillance of Klebsiella pneumoniae and related species.
      homepage: https://github.com/klebgenomics/Kleborate
      licence: ["GPL v3"]
input:
  - - meta: {type: map, description: Genome metadata}
    - preset: {type: string, description: "kpsc, kosc, escherichia or empty"}
    - module_list: {type: string, description: Comma-separated Kleborate modules}
    - assembly: {type: file, description: Genome FASTA (plain or gzipped), pattern: "*.{fa,fasta,fna}{,.gz}"}
output:
  - txt: {type: file, description: "Kleborate table renamed to <prefix>.txt; absent if Kleborate wrote none", pattern: "*.txt"}
  - versions_kleborate: {type: tuple, description: Process, tool and version}
authors: ["@tnmquann"]
