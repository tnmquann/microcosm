name: amrfinderplus_run_local
description: Run AMRFinderPlus 3.12.8 against an explicitly validated 3.12.x database.
keywords:
  - bacteria
  - fasta
  - antimicrobial resistance
tools:
  - amrfinderplus:
      description: Identify antimicrobial resistance and virulence genes in proteins or contigs.
      homepage: https://github.com/ncbi/amr/wiki
      documentation: https://github.com/ncbi/amr/wiki
      tool_dev_url: https://github.com/ncbi/amr
      doi: "10.1038/s41598-021-91456-0"
      licence:
        - "Public Domain"
input:
  - - meta:
        type: map
        description: Canonical sample metadata, optionally including a validated organism taxgroup.
    - fasta:
        type: file
        description: Nucleotide or protein FASTA.
        pattern: "*.{fasta,fasta.gz,fa,fa.gz,fna,fna.gz,faa,faa.gz}"
  - db:
      type: file
      description: AMRFinderPlus 3.12.x database directory or compressed tar archive.
output:
  report:
    - - meta:
        type: map
        description: Canonical sample metadata.
      - "*.tsv":
        type: file
        description: AMRFinderPlus report.
        pattern: "*.tsv"
  mutation_report:
    - - meta:
        type: map
        description: Canonical sample metadata.
      - "*-mutations.tsv":
        type: file
        description: Organism-specific mutation report.
        pattern: "*-mutations.tsv"
  tool_version:
    - VER:
        type: string
        description: AMRFinderPlus software version.
  db_version:
    - DBVER:
        type: string
        description: AMRFinderPlus database version.
  versions:
    - "versions.yml":
        type: file
        description: Software and database versions.
        pattern: "versions.yml"
authors:
  - "@rpetit3"
  - "@louperelo"
  - "@jfy133"
  - "@tnmquann"
maintainers:
  - "@tnmquann"
