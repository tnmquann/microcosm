name: "stage_rgi_database_aliases"
description: "Expose one validated CARD/WildCARD directory under collision-safe staged names."
keywords:
  - rgi
  - card
  - staging
tools:
  - "coreutils":
      description: "GNU core utilities."
      homepage: "https://www.gnu.org/software/coreutils/"
      licence:
        - "GPL-3.0-or-later"
input:
  - rgi_database:
      type: value
      description: "Absolute read-only processed CARD database path."
  - validation_ready:
      type: file
      description: "Successful validation dependency token."
output:
  card:
    - "card_db":
        type: directory
        description: "CARD input alias."
  wildcard:
    - "wildcard_db":
        type: directory
        description: "WildCARD input alias."
  versions:
    - "versions.yml":
        type: file
        description: "Software versions."
        pattern: "versions.yml"
authors:
  - "@tnmquann"
maintainers:
  - "@tnmquann"
