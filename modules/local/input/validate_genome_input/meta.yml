name: "validate_genome_input"
description: "Validate and normalize the standalone bacterial-genome CSV contract."
keywords:
  - input
  - fasta
  - taxonomy
tools:
  - "python":
      description: "Python standard library runtime."
      homepage: "https://www.python.org/"
      licence:
        - "PSF-2.0"
input:
  - genome_csv:
      type: file
      description: "CSV containing sample_id, fasta, and optional metadata/lineage."
      pattern: "*.csv"
  - classification_available:
      type: boolean
      description: "Whether Sourmash classification inputs are configured."
  - validator_script:
      type: file
      description: "Repository-local validation script."
      pattern: "*.py"
output:
  validated_csv:
    - "validated_genomes.csv":
        type: file
        description: "Validated canonical genome manifest."
        pattern: "*.csv"
  versions:
    - "versions.yml":
        type: file
        description: "Software versions."
        pattern: "versions.yml"
authors:
  - "@tnmquann"
maintainers:
  - "@tnmquann"
