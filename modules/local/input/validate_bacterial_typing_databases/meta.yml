name: "validate_bacterial_typing_databases"
description: "Validate read-only VirulenceFinder and user-supplied BLAST reference inputs."
keywords:
  - bacteria
  - typing
  - database
  - validation
tools:
  - "python":
      description: "Python standard library runtime."
      homepage: "https://www.python.org/"
      licence:
        - "PSF-2.0"
input:
  - virulencefinder_db:
      type: directory
      description: "Read-only VirulenceFinder database containing config, notes.txt, and declared data files."
  - blast_reference:
      type: file
      description: "Optional user-supplied reference FASTA; mutually exclusive with blast_db."
  - blast_db:
      type: directory
      description: "Optional user-supplied prebuilt nucleotide BLAST database; mutually exclusive with blast_reference."
  - blast_db_label:
      type: string
      description: "Explicit provenance label for the user-supplied BLAST reference."
  - validator_script:
      type: file
      description: "Repository-local database validator."
      pattern: "*.py"
output:
  validation:
    - "general_typing_database_validation.tsv":
        type: file
        description: "Validated database/reference manifest."
        pattern: "*.tsv"
  ready:
    - "general_typing_databases.ready":
        type: file
        description: "Dependency token emitted only after successful validation."
  versions:
    - "versions.yml":
        type: file
        description: "Software versions."
        pattern: "versions.yml"
authors:
  - "@tnmquann"
maintainers:
  - "@tnmquann"
