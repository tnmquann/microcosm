name: "validate_bacterial_amr_databases"
description: "Validate all read-only database structures required by bacterial AMR tools."
keywords:
  - amr
  - database
  - validation
tools:
  - "python":
      description: "Python standard library runtime."
      homepage: "https://www.python.org/"
      licence:
        - "PSF-2.0"
input:
  - database_paths:
      type: value
      description: "Explicit AMRFinderPlus, ABRicate, CARD, ResFinder, PointFinder, and DeepARG paths."
  - validator_script:
      type: file
      description: "Repository-local database validator."
      pattern: "*.py"
output:
  validation:
    - "amr_database_validation.tsv":
        type: file
        description: "Validated database manifest."
        pattern: "*.tsv"
  amrfinder_organisms:
    - "amrfinder_supported_organisms.tsv":
        type: file
        description: "Mutation-capable AMRFinderPlus taxgroups."
        pattern: "*.tsv"
  pointfinder_species:
    - "pointfinder_supported_species.tsv":
        type: file
        description: "Usable PointFinder database directories."
        pattern: "*.tsv"
  ready:
    - "amr_databases.ready":
        type: file
        description: "Dependency token emitted only after successful validation."
  versions:
    - "versions.yml":
        type: file
        description: "Software versions."
        pattern: "versions.yml"
authors:
  - "@tnmquann"
maintainers:
  - "@tnmquann"
