name: "normalize_genome_classifications"
description: "Normalize Sourmash tax-genome CSV outputs into resolved and unresolved lineage tables."
keywords:
  - sourmash
  - taxonomy
  - routing
tools:
  - "python":
      description: "Python standard library runtime."
      homepage: "https://www.python.org/"
      licence:
        - "PSF-2.0"
input:
  - classification_csvs:
      type: file
      description: "One or more Sourmash tax-genome CSV files."
      pattern: "*.csv"
  - normalizer_script:
      type: file
      description: "Repository-local classification normalizer."
      pattern: "*.py"
output:
  resolved_tsv:
    - "resolved_genome_lineages.tsv":
        type: file
        description: "Resolved GTDB lineage rows."
        pattern: "*.tsv"
  unresolved_tsv:
    - "unresolved_classification_rows.tsv":
        type: file
        description: "Rows without a resolved lineage."
        pattern: "*.tsv"
  versions:
    - "versions.yml":
        type: file
        description: "Software versions."
        pattern: "versions.yml"
authors:
  - "@tnmquann"
maintainers:
  - "@tnmquann"
