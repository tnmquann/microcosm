name: "filter_bacterial_blast_hits"
description: "Filter fixed-schema bacterial BLASTN hits and summarize retained reference genes."
keywords:
  - blastn
  - filtering
  - typing
tools:
  - "python":
      description: "Python standard library runtime."
      homepage: "https://www.python.org/"
      licence:
        - "PSF-2.0"
input:
  - blast_results:
      type: file
      description: "Headerless 13-column BLASTN outfmt 6 result."
      pattern: "*.txt"
  - minimum_identity:
      type: float
      description: "Minimum percent identity in the inclusive range 0 to 100."
  - minimum_coverage:
      type: float
      description: "Minimum reference subject coverage in the inclusive range 0 to 100."
  - minimum_overlap_bp:
      type: integer
      description: "Minimum shared query bases for deterministic duplicate resolution."
  - filter_script:
      type: file
      description: "Repository-local fixed-schema BLASTN filter."
      pattern: "*.py"
output:
  filtered_hits:
    - "*.blastn_filtered_hits.tsv":
        type: file
        description: "Threshold-passing, overlap-resolved detailed hits."
        pattern: "*.tsv"
  summary:
    - "*.blastn_summary.tsv":
        type: file
        description: "Deterministic retained-hit counts by reference subject identifier."
        pattern: "*.tsv"
  versions:
    - "versions.yml":
        type: file
        description: "Software versions."
        pattern: "versions.yml"
authors:
  - "@tnmquann"
maintainers:
  - "@tnmquann"
