name: "write_general_typing_manifest"
description: "Write per-genome execution and result-state records for general bacterial typing."
keywords:
  - bacteria
  - typing
  - reporting
  - provenance
tools:
  - "python":
      description: "Python standard library runtime."
      homepage: "https://www.python.org/"
      licence:
        - "PSF-2.0"
input:
  - reports:
      type: file
      description: "VirulenceFinder, PlasmidFinder, MLST, and BLASTN raw tabular outputs."
  - blast_reference_type:
      type: string
      description: "Whether BLAST used a user reference FASTA or prebuilt database."
  - blast_reference_label:
      type: string
      description: "Explicit user reference provenance label."
  - manifest_script:
      type: file
      description: "Repository-local manifest writer."
      pattern: "*.py"
output:
  manifest:
    - - meta:
          type: map
          description: "Canonical bacterial-genome metadata."
      - "*.general_typing_manifest.tsv":
          type: file
          description: "Per-genome general-typing manifest."
          pattern: "*.tsv"
  versions:
    - "versions.yml":
        type: file
        description: "Software versions."
        pattern: "versions.yml"
authors:
  - "@tnmquann"
maintainers:
  - "@tnmquann"
