name: "parse_salmonella_typing"
description: "Record SeqSero2/SISTR evidence and route Salmonella follow-up from the SISTR serovar only (Typhi -> GenoTyphi, Paratyphi A -> Paratype)."
keywords:
  - salmonella
  - typing
  - routing
tools:
  - "python":
      description: "Python standard-library parser runtime."
      homepage: "https://www.python.org/"
      licence:
        - "PSF-2.0"
input:
  - meta:
      type: map
      description: "Canonical bacterial-genome metadata including sample_id and genome_id."
  - seqsero2_tsv:
      type: file
      description: "SeqSero2 tab-delimited result."
  - sistr_tsv:
      type: file
      description: "SISTR tab-delimited prediction result."
  - parser_script:
      type: file
      description: "Repository-local explicit-evidence parser."
      pattern: "*.py"
output:
  evidence:
    - "*.salmonella_evidence.tsv":
        type: file
        description: "One structured evidence row per routing tool."
        pattern: "*.tsv"
  routing:
    - "*.salmonella_routing.tsv":
        type: file
        description: "SISTR-only Typhi/Paratyphi A routing decision; SeqSero2 conflict recorded."
        pattern: "*.tsv"
  versions:
    - "versions.yml":
        type: file
        description: "Parser and Python versions."
authors:
  - "@tnmquann"
maintainers:
  - "@tnmquann"
