  microcosm_bin_taxonomy:
    order: 960
  microcosm_bin_summary:
    order: 955
  microcosm_rgi_bwt:
    order: 965
  microcosm_rgi_bwt_families:
    order: 964
  microcosm_bacterial_overview:
    order: 950
  microcosm_kleborate:
    order: 948
  microcosm_salmonella:
    order: 947
  microcosm_rgi_amr:
    order: 945
  microcosm_rgi_amr_families:
    order: 944
  fastqc_raw:
    order: 900
  fastp:
    order: 890
  hostile:
    order: 880
  fastqc_cleaned:
    order: 870
  quast_assembly:
    order: 800
  microcosm_contig_summary:
    order: 798
  microcosm_pyrodigal:
    order: 797
  prokka_contigs:
    order: 796
  microcosm_genomad:
    order: 795
  microcosm_contig_tiara:
    order: 794
  microcosm_contig_skani:
    order: 793
  bowtie2_assembly:
